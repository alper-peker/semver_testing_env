name: Label Guard

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  pull-requests: write
  issues: write

jobs:
  enforce_label_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Label Rules
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const action = context.payload.action;
            const changedLabel = context.payload.label ? context.payload.label.name : "";
            
            const senderObj = context.payload.sender;
            const senderName = senderObj ? senderObj.login : context.actor;
            const senderType = senderObj ? senderObj.type : "User"; 

            if (action === "labeled" && changedLabel === "approved") {
              
              if (senderType !== "Bot" && senderName !== "github-actions[bot]") {
                
                const comments = await github.rest.issues.listComments({
                  owner, repo, issue_number: number, per_page: 5, sort: "created", direction: "desc"
                });

                if (comments.data.length > 0) {
                  const lastComment = comments.data[0];
                  if (lastComment.user.type === "Bot" && 
                      lastComment.body.includes("Approved! Total approvals:")) {
                    
                    core.info(`✅ Label added by ${senderName} but validated via Bot comment. Allowed.`);
                    return;
                  }
                }
                
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: number, name: "approved"
                });

                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `⛔ **Security Alert:** The 'approved' label cannot be added manually by @${senderName}.\n\nPlease use the \`/approve\` command.`
                });
                
                core.setFailed(`Manual approval attempt blocked for user: ${senderName}`);
                return; 
              }
            }

            if (changedLabel !== "approved") {
               const labels = await github.rest.issues.listLabelsOnIssue({
                  owner, repo, issue_number: number
               });
               const labelNames = labels.data.map(l => l.name);

               if (labelNames.includes("approved")) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: number, name: "approved"
                  });

                  await github.rest.issues.createComment({
                    owner, repo, issue_number: number,
                    body: `🔄 **System Reset:** Labels were changed by @${senderName}. Previous approvals have been invalidated to ensure safety.`
                  });
                  core.info("Approvals reset due to label change.");
               }
            }
