name: Label Guard

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  pull-requests: write
  issues: write

jobs:
  enforce_label_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Label Rules
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const action = context.payload.action;
            const changedLabel = context.payload.label ? context.payload.label.name : "";
            
            const senderObj = context.payload.sender;
            const senderName = senderObj ? senderObj.login : "unknown";
            const senderType = senderObj ? senderObj.type : "unknown";
            const actor = context.actor;

            console.log("--- DEBUG INFO ---");
            console.log(`Action: ${action}`);
            console.log(`Label: ${changedLabel}`);
            console.log(`Sender Login: ${senderName}`);
            console.log(`Sender Type: ${senderType}`);
            console.log(`Actor: ${actor}`);
            console.log("------------------");

            if (action === "labeled" && changedLabel === "approved") {
              
              const isBot = senderType === "Bot" || senderName === "github-actions[bot]" || senderName.endsWith("[bot]");

              if (!isBot) {
                console.log(`Blocking manual approval by: ${senderName}`);
                
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: number, name: "approved"
                });

                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `⛔ **Security Alert:** The 'approved' label cannot be added manually by @${senderName}.\n\nDebug Info: User identified as Type '${senderType}'. Please use the \`/approve\` command.`
                });
                
                core.setFailed(`Manual approval attempt blocked for user: ${senderName}`);
                return; 
              } else {
                 console.log(`Approval allowed for bot: ${senderName}`);
              }
            }

            if (changedLabel !== "approved") {
               const labels = await github.rest.issues.listLabelsOnIssue({
                  owner, repo, issue_number: number
               });
               const labelNames = labels.data.map(l => l.name);

               if (labelNames.includes("approved")) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: number, name: "approved"
                  });

                  await github.rest.issues.createComment({
                    owner, repo, issue_number: number,
                    body: `🔄 **System Reset:** Labels were changed by @${senderName}. Previous approvals have been invalidated to ensure safety.`
                  });
                  core.info("Approvals reset due to label change.");
               }
            }
